worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # En-têtes de sécurité (répétés dans les locations qui ont leur propre add_header)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # index.html ne doit jamais être mis en cache : il référence les bundles hashés
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Bundles générés par Angular avec un hash dans le nom (main-XXXX.js, styles-XXXX.css, chunk-XXXX.js…)
        location ~* "^/[^/]+-[A-Z0-9]{8}\.(js|css)$" {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Fichiers statiques non hashés (public/ : images, img, media, css, assets/leaflet…)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Angular SPA fallback : /login, /actu, /dashboards… sont gérés par le router Angular
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
